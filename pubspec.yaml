name: the_styliste
description: "Portrait-first mobile hybrid idle + tycoon fashion empire simulator."
publish_to: 'none'
version: 0.1.0-alpha.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Navigation ---
  go_router: ^14.2.0

  # --- Backend: Supabase ---
  supabase_flutter: ^2.5.0

  # --- Local Persistence ---
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0

  # --- Utilities: URL ---
  url_launcher: ^6.3.0

  # --- Cosmetic Game Scenes ---
  flame: ^1.37.0

  # --- Monetization ---
  in_app_purchase: ^3.2.0

  # --- Data / Serialization ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Device / Telemetry ---
  package_info_plus: ^8.1.0
  device_info_plus: ^10.1.0

  # --- Utilities ---
  uuid: ^4.4.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  logger: ^2.4.0

  # --- UI / Icons ---
  cupertino_icons: ^1.0.8

  # --- Sensors retained for the HQ visual fallback ---
  sensors_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # --- Code Generation ---
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.0

  # --- Linting ---
  flutter_lints: ^4.0.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.3

dependency_overrides:
  analyzer_plugin: ^0.13.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

  shaders:
    - lib/shaders/cloth_physics.frag
    - lib/shaders/liquid_chrome.frag
    - lib/shaders/liquid_gold.frag
    - lib/shaders/shatter.frag
